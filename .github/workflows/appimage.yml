name: AppImage

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build from
        required: true

permissions:
  contents: write

concurrency:
  group: appimage-${{ github.event_name }}-${{ github.event.release.tag_name || inputs.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REF: ${{ github.event.release.tag_name || inputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.ref || inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet publish cross/Capri.Cross.csproj -c Release -r linux-x64 --self-contained -o out/Capri -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none
      - name: Pack
        run: |
          set -e
          mkdir -p AppDir/usr/bin
          cp out/Capri/Capri AppDir/usr/bin/Capri
          cp cross/linux/capri-desktop.desktop AppDir/capri-desktop.desktop
          cp cross/icon.png AppDir/capri-desktop.png
          printf '#!/bin/sh\nexec "$APPDIR/usr/bin/Capri" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir Capri-linux-x64.AppImage
          sha256sum Capri-linux-x64.AppImage | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install a test desktop
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth openbox xcompmgr libice6 libsm6 libfontconfig1
      - name: Smoke test
        timeout-minutes: 10
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; xcompmgr & sleep 1; ./Capri-linux-x64.AppImage --appimage-extract-and-run --smoke "$PWD/smoke/appimage"' || true
          cat smoke/appimage/smoke-test.txt
          if grep -q '^FAIL' smoke/appimage/smoke-test.txt; then exit 1; fi
          test "$(grep -c '^PASS' smoke/appimage/smoke-test.txt)" -ge 20
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$REF" Capri-linux-x64.AppImage --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage
          path: Capri-linux-x64.AppImage
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-appimage
          path: smoke
          if-no-files-found: ignore
