name: Release checksums

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, draft or published
        required: true

permissions:
  contents: write

concurrency:
  group: release-sums-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  sums:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: SHA256SUMS.txt covers every asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: bash ci/release-sums.sh "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
