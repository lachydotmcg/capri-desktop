name: Android

on:
  push:
    branches: [main, 'rc-*']
    paths:
      - 'android/**'
      - 'site/remote/**'
      - 'site/assets/sprites/**'
      - 'site/assets/fonts/**'
      - 'quest/Assets/Capri/Resources/CapriSprites/**'
      - 'ci/android-smoke.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'site/remote/**'
      - 'site/assets/sprites/**'
      - 'site/assets/fonts/**'
      - 'quest/Assets/Capri/Resources/CapriSprites/**'
      - 'ci/android-smoke.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the APK
        run: |
          mkdir -p out/android
          cp android/app/build/outputs/apk/debug/app-debug.apk out/android/Capri-android-debug.apk
          sha256sum out/android/Capri-android-debug.apk | tee out/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Capri-android-debug
          path: |
            out/android/Capri-android-debug.apk
            out/android/SHA256SUMS.txt
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front emulated
          script: node ci/android-smoke.mjs out/android/Capri-android-debug.apk out/android/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-android
          path: out/android/smoke
          if-no-files-found: warn
