name: CI

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build and smoke test
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows -SmokeTest -SmokeSeconds 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: out/windows/smoke

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/linux
      - name: Install a test desktop
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth openbox xcompmgr libice6 libsm6 libfontconfig1
      - name: Smoke test
        timeout-minutes: 5
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; xcompmgr & sleep 1; out/linux/Capri --smoke "$PWD/smoke/linux"' || true
          cat smoke/linux/smoke-test.txt
          ! grep -q '^FAIL' smoke/linux/smoke-test.txt
          test "$(grep -c '^PASS' smoke/linux/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/mac
      - name: Smoke test
        timeout-minutes: 5
        run: |
          out/mac/Capri --smoke "$PWD/smoke/mac" || true
          cat smoke/mac/smoke-test.txt
          ! grep -q '^FAIL' smoke/mac/smoke-test.txt
          test "$(grep -c '^PASS' smoke/mac/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-mac
          path: smoke
