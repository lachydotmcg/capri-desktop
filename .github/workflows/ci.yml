name: CI

on:
  push:
    branches: [main, 'rc-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One build, so both smoke halves and the release test the same Capri.exe.
  windows-build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows
      # The files the smoke test ran, so a release can ship exactly those.
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/windows/Capri.exe
            out/windows/Capri-Setup.exe
          if-no-files-found: error

  # --steps runs every step and each --shard runs a quarter of the sections, so the five parts together are the whole
  # smoke test; ci/smoke-timings checks that every section lands in exactly one shard, and windows-total adds them up.
  windows:
    needs: windows-build
    runs-on: windows-2025
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: steps
            args: --steps
          - part: sections-0
            args: --no-steps --shard 0/4
          - part: sections-1
            args: --no-steps --shard 1/4
          - part: sections-2
            args: --no-steps --shard 2/4
          - part: sections-3
            args: --no-steps --shard 3/4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out/windows
      - name: Full size screen
        shell: powershell
        run: ./ci/wide-screen.ps1
      - name: Smoke test
        shell: pwsh
        run: |
          $out = [IO.Path]::GetFullPath('out/windows')
          $runtime = Join-Path $out 'smoke\runtime'
          $check = Start-Process -FilePath (Join-Path $out 'Capri.exe') -ArgumentList (@('--smoke-test', ('"' + $runtime + '"')) + '${{ matrix.args }}'.Split(' ')) -PassThru -WindowStyle Hidden
          if (-not $check.WaitForExit(2100 * 1000)) { $check.Kill(); throw 'Runtime smoke test timed out.' }
          if (Test-Path -LiteralPath (Join-Path $runtime 'smoke-test.txt')) { Get-Content -LiteralPath (Join-Path $runtime 'smoke-test.txt') }
          else { throw 'Runtime smoke test wrote no results.' }
          if ($check.ExitCode -ne 0) {
              if (Test-Path -LiteralPath (Join-Path $runtime 'failure.txt')) { Get-Content -LiteralPath (Join-Path $runtime 'failure.txt') }
              throw 'Runtime smoke test failed.'
          }
      - name: Installer check
        if: matrix.part == 'sections-0'
        shell: pwsh
        run: |
          $out = [IO.Path]::GetFullPath('out/windows')
          $app = Join-Path $out 'Capri.exe'
          $package = Join-Path $out 'smoke\package'
          $verify = Start-Process -FilePath (Join-Path $out 'Capri-Setup.exe') -ArgumentList @('--verify', ('"' + $package + '"')) -PassThru -WindowStyle Hidden
          if (-not $verify.WaitForExit(2100 * 1000)) { $verify.Kill(); throw 'Installer check timed out.' }
          if ($verify.ExitCode -ne 0) {
              if (Test-Path -LiteralPath (Join-Path $package 'failure.txt')) { Get-Content -LiteralPath (Join-Path $package 'failure.txt') }
              throw 'Installer check failed.'
          }
          if ((Get-FileHash -LiteralPath (Join-Path $package 'Capri.exe')).Hash -ne (Get-FileHash -LiteralPath $app).Hash) { throw 'Installer payload differs from the app executable.' }
          Get-Content -LiteralPath (Join-Path $package 'packaging-test.txt')
          Write-Output 'PASS installer payload matches the app'
      - name: Package marker
        if: always() && matrix.part == 'sections-0'
        shell: pwsh
        run: |
          $env:CAPRI_DISPOSABLE_USER = '1'
          ./ci/test-package-marker.ps1 -Setup out/windows/Capri-Setup.exe
      - name: Slowest smoke sections
        if: always()
        shell: pwsh
        run: |
          $timings = 'out/windows/smoke/runtime/smoke-timings.txt'
          if (-not (Test-Path -LiteralPath $timings)) { Write-Output 'No smoke-timings.txt'; exit 0 }
          $rows = Import-Csv -LiteralPath $timings -Delimiter "`t" | Sort-Object { [double]$_.own_ms } -Descending
          $total = ($rows | Measure-Object -Property own_ms -Sum).Sum / 1000
          $lines = @("| section | parent | own s | inclusive s |", "|---|---|---:|---:|")
          $lines += $rows | Select-Object -First 40 | ForEach-Object { '| {0} | {1} | {2:N1} | {3:N1} |' -f $_.section, $_.parent, ([double]$_.own_ms / 1000), ([double]$_.inclusive_ms / 1000) }
          $lines = @("Timed sections: $($rows.Count), own time $([math]::Round($total)) s", '') + $lines
          $lines | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows-${{ matrix.part }}
          path: out/windows/smoke

  windows-total:
    needs: windows
    if: always() && needs.windows.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: smoke-windows-*
          path: smoke
      - name: All five parts ran and passed
        run: |
          for part in steps sections-0 sections-1 sections-2 sections-3; do
            test -s "smoke/smoke-windows-$part/runtime/smoke-test.txt" || { echo "smoke-windows-$part has no report"; exit 1; }
          done
          cat smoke/smoke-windows-*/runtime/smoke-test.txt > all.txt
          grep '^TOTAL' smoke/smoke-windows-*/runtime/smoke-test.txt
          passed=$(grep -c '^PASS' all.txt)
          echo "PASS lines across all parts: $passed" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q '^FAIL' all.txt; then grep '^FAIL' all.txt; exit 1; fi
          test "$passed" -ge 1850
          test "${{ needs.windows.result }}" = success

  # Her silent install and uninstall change the runner's own Capri, so they get a fresh runner of their own.
  windows-setup:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: pwsh
        run: ./ci/build-windows.ps1 -OutputDirectory out/windows
      - name: Silent install and uninstall
        shell: pwsh
        run: |
          $env:CAPRI_DISPOSABLE_USER = '1'
          ./ci/test-silent-install.ps1 -Setup out/windows/Capri-Setup.exe
          ./ci/test-silent-uninstall.ps1 -Setup out/windows/Capri-Setup.exe

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Native Linux dependencies
        run: |
          if ! getent hosts azure.archive.ubuntu.com > /dev/null; then
            sudo resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8 && sudo resolvectl flush-caches
            getent hosts azure.archive.ubuntu.com || echo "azure.archive.ubuntu.com still has no address"
          fi
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libxcb1-dev pkg-config
      - name: Focused Linux checks
        run: bash ci/check-linux.sh
      - name: Smoke sections and shards
        run: dotnet run --project ci/smoke-timings/SmokeTimingsTest.csproj -c Release -- "$RUNNER_TEMP/smoke-timings"
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/linux
      - name: Install a test desktop
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth openbox xcompmgr libice6 libsm6 libfontconfig1
      - name: Smoke test
        timeout-minutes: 5
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; xcompmgr & sleep 1; out/linux/Capri --smoke "$PWD/smoke/linux"' || true
          cat smoke/linux/smoke-test.txt
          if grep -q '^FAIL' smoke/linux/smoke-test.txt; then exit 1; fi
          test "$(grep -c '^PASS' smoke/linux/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke

  # The same checks on arm64, as on a Raspberry Pi 5. It publishes with the arm64 lock file, so a release builds what ran here.
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Native Linux dependencies
        run: |
          if ! getent hosts azure.archive.ubuntu.com > /dev/null; then
            sudo resolvectl dns "$(ip route show default | awk '{print $5; exit}')" 1.1.1.1 8.8.8.8 && sudo resolvectl flush-caches
            getent hosts azure.archive.ubuntu.com || echo "azure.archive.ubuntu.com still has no address"
          fi
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libwayland-dev libxkbcommon-dev libxcb1-dev pkg-config
      - name: Focused Linux checks
        run: bash ci/check-linux.sh
      - name: Build
        run: bash ci/build-linux.sh "$PWD/out/Capri" linux-arm64
      - name: Her voice, ears and plan wheels exist for arm64
        run: |
          set -e
          python3 -m pip --version || { sudo apt-get install -y -q --no-install-recommends python3-pip && python3 -m pip --version; }
          for lock in kokoro-runtime.lock:3.14 asr-requirements.lock:3.11 plan-requirements.lock:3.13; do
            python3 -m pip download --quiet --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
              --implementation cp --python-version "${lock#*:}" -d "$RUNNER_TEMP/wheels/${lock%%:*}" -r "tools/${lock%%:*}"
          done
          ls "$RUNNER_TEMP"/wheels/*
      - name: Install a test desktop
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth openbox xcompmgr libice6 libsm6 libfontconfig1
      - name: Smoke test
        timeout-minutes: 10
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" bash -c 'openbox & sleep 2; xcompmgr & sleep 1; out/Capri/Capri --smoke "$PWD/smoke/linux-arm64"' || true
          cat smoke/linux-arm64/smoke-test.txt
          if grep -q '^FAIL' smoke/linux-arm64/smoke-test.txt; then exit 1; fi
          test "$(grep -c '^PASS' smoke/linux-arm64/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux-arm64
          path: smoke

  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build cross/Capri.Cross.csproj -c Release -o out/mac
      - name: Smoke test
        timeout-minutes: 8
        run: |
          out/mac/Capri --smoke "$PWD/smoke/mac" || true
          cat smoke/mac/smoke-test.txt
          if grep -q '^FAIL' smoke/mac/smoke-test.txt; then exit 1; fi
          test "$(grep -c '^PASS' smoke/mac/smoke-test.txt)" -ge 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-mac
          path: smoke
