name: Bug Report
description: Report something Capri does wrong
labels: ["bug"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I am on the latest release (if not, say your version below)
          required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Best effort is fine - what you were doing when it went wrong.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: platform
    attributes:
      label: Platform
      description: Capri version, OS, and on Linux the desktop or compositor (GNOME, KDE, Hyprland, niri, X11...), plus the Windows version when relevant.
      placeholder: "Capri 0.9.6, Fedora 43 + GNOME (Wayland)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Her errors.txt content or screenshots that show the problem. Remove anything private first.
